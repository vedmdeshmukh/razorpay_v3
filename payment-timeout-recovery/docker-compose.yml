services:
  backend:
    build: ./backend
    environment:
      APP_ENV: development
      GATEWAY_MODE: simulator
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev -- --host 0.0.0.0; else tail -f /dev/null; fi"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
